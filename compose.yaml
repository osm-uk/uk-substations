name: uk-substations

services:
  shell:
    build:
      context: .
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity

  process:
    build: .
    command: python /app/process.py
    image: uk-substations:latest
    volumes:
      - .:/app

  test:
    build: .
    command: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics && flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics && pytest
    image: uk-substations:latest
    volumes:
      - .:/app
